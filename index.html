<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>橙子资产管家 · 泡泡英语</title>
<style>
/* ============ 基础 ============ */
:root{
  --c-bg:#EAF4FF; --c-card:#FFFFFF; --c-primary:#4A90E2; --c-accent:#FFB43B;
  --c-success:#5BC588; --c-danger:#FF6B6B; --c-text:#2C3E50; --c-muted:#95A5A6;
  --radius:16px; --shadow:0 6px 20px rgba(74,144,226,.16);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--c-bg);
  color:var(--c-text);min-height:100vh}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font-family:inherit;font-size:inherit;color:inherit}
img{max-width:100%}

/* ============ 门帘 ============ */
#gate{position:fixed;inset:0;background:linear-gradient(160deg,#B9E0FF,#EAF4FF);display:flex;
  align-items:center;justify-content:center;z-index:999}
#gate .box{background:var(--c-card);border-radius:24px;padding:38px 34px;box-shadow:var(--shadow);
  width:min(90%,340px);text-align:center}
#gate h1{font-size:1.5rem;margin-bottom:6px}
#gate p{color:var(--c-muted);font-size:.85rem;margin-bottom:20px}
#gate input{width:100%;padding:12px 14px;border:2px solid #E3ECF5;border-radius:12px;font-size:1rem;
  text-align:center;letter-spacing:2px;outline:none}
#gate input:focus{border-color:var(--c-primary)}
#gate button{width:100%;margin-top:14px;padding:12px;border-radius:12px;background:var(--c-primary);
  color:#fff;font-weight:700;font-size:1rem}
#gate .err{color:var(--c-danger);font-size:.82rem;height:1.2em;margin-top:10px}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.shake{animation:shake .35s}

/* ============ 主框架 ============ */
#app{max-width:1080px;margin:0 auto;padding:16px 18px 60px}
.topbar{display:flex;align-items:center;gap:12px;background:var(--c-card);border-radius:var(--radius);
  padding:12px 16px;box-shadow:var(--shadow);flex-wrap:wrap}
.topbar h1{font-size:1.15rem;flex:1;min-width:180px}
.badge{font-size:.75rem;padding:4px 10px;border-radius:20px;background:#F0F5FA;color:var(--c-muted);font-weight:600}
.badge.ok{background:#E6F7ED;color:var(--c-success)}
.badge.no{background:#FFEEEE;color:var(--c-danger)}
.btn{padding:9px 16px;border-radius:11px;font-weight:700;font-size:.9rem;background:#F0F5FA;transition:transform .12s}
.btn:active{transform:scale(.95)}
.btn-primary{background:var(--c-primary);color:#fff}
.btn-success{background:var(--c-success);color:#fff}
.btn-danger{background:#FFEEEE;color:var(--c-danger)}
.btn:disabled{opacity:.5;cursor:not-allowed}

.tabs{display:flex;gap:8px;margin:14px 0}
.tabs button{flex:1;padding:11px;border-radius:12px;background:var(--c-card);font-weight:700;
  box-shadow:var(--shadow);color:var(--c-muted)}
.tabs button.on{background:var(--c-primary);color:#fff}
.tabs button .n{opacity:.75;font-size:.85em;margin-left:4px}

.toolbar{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
.toolbar input[type=search]{flex:1;min-width:160px;padding:9px 13px;border:2px solid #E3ECF5;
  border-radius:11px;outline:none;background:var(--c-card)}
.toolbar input[type=search]:focus{border-color:var(--c-primary)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.card{background:var(--c-card);border-radius:var(--radius);padding:12px;box-shadow:var(--shadow);
  display:flex;gap:11px;align-items:center;position:relative}
.card .thumb{width:54px;height:54px;border-radius:12px;background:#F5F8FB;display:flex;align-items:center;
  justify-content:center;font-size:1.7rem;flex-shrink:0;overflow:hidden}
.card .thumb img{max-width:100%;max-height:100%;object-fit:contain}
.card .info{flex:1;min-width:0}
.card .t{font-weight:700;font-size:.98rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .s{font-size:.76rem;color:var(--c-muted);margin-top:3px}
.card .ops{display:flex;flex-direction:column;gap:5px}
.card .ops button{font-size:.75rem;padding:4px 9px;border-radius:8px;background:#F0F5FA;font-weight:700}
.card .ops button.d{background:#FFEEEE;color:var(--c-danger)}
.card .add{justify-content:center;min-height:84px;border:2px dashed #CFE0F0;color:var(--c-primary);
  font-weight:700;cursor:pointer;background:rgba(255,255,255,.6)}

.empty{padding:50px 20px;text-align:center;color:var(--c-muted)}

/* ============ 弹窗 ============ */
#mask{position:fixed;inset:0;background:rgba(20,40,60,.45);z-index:200;display:none;
  align-items:center;justify-content:center;padding:18px}
#mask.show{display:flex}
#modal{background:var(--c-card);border-radius:20px;padding:22px;width:min(94%,460px);
  max-height:88vh;overflow-y:auto;box-shadow:0 14px 44px rgba(0,0,0,.25)}
#modal h3{margin-bottom:16px;font-size:1.1rem}
.frow{margin-bottom:13px}
.frow label{display:block;font-size:.82rem;color:var(--c-muted);font-weight:700;margin-bottom:6px}
.frow input[type=text],.frow input[type=number],.frow input[type=password],.frow textarea{
  width:100%;padding:10px 12px;border:2px solid #E3ECF5;border-radius:11px;outline:none}
.frow input:focus,.frow textarea:focus{border-color:var(--c-primary)}
.frow .hint{font-size:.75rem;color:var(--c-muted);margin-top:5px;line-height:1.55}
.imgpick{display:flex;gap:12px;align-items:center}
.imgpick .pv{width:74px;height:74px;border-radius:14px;background:#F5F8FB;border:2px dashed #CFE0F0;
  display:flex;align-items:center;justify-content:center;font-size:2rem;overflow:hidden;cursor:pointer;
  flex-shrink:0}
.imgpick .pv img{max-width:100%;max-height:100%;object-fit:contain}
.imgpick .pv.drag{border-color:var(--c-primary);background:#EAF4FF}
.imgpick .col{flex:1;display:flex;flex-direction:column;gap:8px}
.imgpick .col button{padding:8px;border-radius:10px;background:#F0F5FA;font-size:.85rem;font-weight:700}
.brow{display:flex;gap:10px;margin-top:18px}
.brow .btn{flex:1;padding:11px}

/* 双栏选词 */
.dual{display:flex;gap:10px}
.dual .col{flex:1;border:2px solid #E3ECF5;border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.dual .col h4{font-size:.78rem;color:var(--c-muted);padding:8px 10px;background:#F7FAFD;margin:0}
.dual .list{height:230px;overflow-y:auto}
.dual .it{display:flex;align-items:center;gap:8px;padding:7px 10px;font-size:.86rem;cursor:pointer;
  border-bottom:1px solid #F2F6FA}
.dual .it:hover{background:#F0F7FF}
.dual .it .th{width:26px;height:26px;border-radius:7px;background:#F5F8FB;display:flex;align-items:center;
  justify-content:center;font-size:1rem;overflow:hidden;flex-shrink:0}
.dual .it .th img{max-width:100%;max-height:100%;object-fit:contain}
.dual .it span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ============ 进度 / 提示 ============ */
#prog{position:fixed;inset:0;background:rgba(20,40,60,.55);z-index:300;display:none;
  align-items:center;justify-content:center}
#prog.show{display:flex}
#prog .box{background:var(--c-card);border-radius:18px;padding:26px 30px;width:min(88%,360px);text-align:center}
#prog .bar{height:10px;background:#ECEFF3;border-radius:6px;overflow:hidden;margin:14px 0 8px}
#prog .bar i{display:block;height:100%;width:0;background:var(--c-primary);transition:width .25s}
#prog .msg{font-size:.86rem;color:var(--c-muted)}
#toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(20px);z-index:400;
  background:#2C3E50;color:#fff;padding:11px 20px;border-radius:12px;font-size:.88rem;opacity:0;
  pointer-events:none;transition:all .25s;max-width:86%}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.log{font-size:.76rem;line-height:1.7;background:#F7FAFD;border:1px solid #EAF0F6;border-radius:11px;
  padding:10px 12px;margin-top:10px;max-height:150px;overflow-y:auto;white-space:pre-wrap;word-break:break-all}
.diff-list{max-height:260px;overflow-y:auto;border:2px solid #E3ECF5;border-radius:12px;padding:6px}
.diff-list .di{display:flex;align-items:center;gap:9px;padding:6px 9px;font-size:.86rem;
  border-bottom:1px solid #F2F6FA}
.diff-list .di:last-child{border-bottom:none}
.diff-list .tag{font-size:.7rem;font-weight:800;padding:2px 8px;border-radius:8px;flex-shrink:0}
.diff-list .tag.add{background:#E6F7ED;color:var(--c-success)}
.diff-list .tag.upd{background:#FFF4E0;color:#D68910}
.diff-list .tag.same{background:#F0F5FA;color:var(--c-muted)}
@media (max-width:620px){ .grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))} }

/* 批量导入面板 */
#modal.wide{width:min(96%,680px)}
.bi-list{max-height:44vh;overflow-y:auto;border:2px solid #E3ECF5;border-radius:12px;padding:6px;margin-top:8px;background:#fff}
.bi-row{display:flex;align-items:center;gap:10px;padding:7px 9px;border-bottom:1px solid #F2F6FA}
.bi-row.dup{background:#FFFBF2}
.bi-thumb{width:44px;height:44px;border-radius:10px;background:#F5F8FB;display:flex;align-items:center;justify-content:center;font-size:1.4rem;overflow:hidden;flex-shrink:0}
.bi-thumb img{max-width:100%;max-height:100%;object-fit:contain}
.bi-word{flex:1;min-width:0;padding:8px 11px;border:2px solid #E3ECF5;border-radius:10px;outline:none}
.bi-word:focus{border-color:var(--c-primary)}
.bi-tag{font-size:.7rem;font-weight:800;padding:2px 8px;border-radius:8px;background:#F0F5FA;color:var(--c-muted);flex-shrink:0}
.bi-tag.err{background:#FFEEEE;color:var(--c-danger)}
.bi-cmp{display:flex;align-items:center;gap:9px;padding:7px 9px 9px 34px;border-bottom:1px solid #F2F6FA;flex-wrap:wrap}
.bi-side{display:flex;align-items:center;gap:5px;font-size:.72rem;color:var(--c-muted)}
.bi-side .bi-thumb{width:36px;height:36px;background:#fff;border:1px solid #eee}
.bi-acts{display:flex;gap:6px;flex-wrap:wrap}
.bi-act{font-size:.75rem;padding:5px 10px;border-radius:9px;background:#F0F5FA;font-weight:700}
.bi-act.on{background:var(--c-primary);color:#fff}
.bi-note{font-size:.72rem;color:#D68910}
</style>
</head>
<body>

<!-- 门帘：防误入。口令在源码 GATE_PASS 处修改 -->
<div id="gate">
  <div class="box">
    <h1>🎈 橙子资产管家</h1>
    <p>泡泡英语 · 电脑端资产管理</p>
    <input type="password" id="gateInput" placeholder="请输入口令" autocomplete="off">
    <button id="gateBtn">进 入</button>
    <div class="err" id="gateErr"></div>
  </div>
</div>

<div id="app" style="display:none">
  <div class="topbar">
    <h1>🎈 橙子资产管家</h1>
    <span class="badge" id="cloudBadge">未连接云端</span>
    <button class="btn" id="btnPull">⬇ 从云端拉取</button>
    <button class="btn btn-success" id="btnPublish">⬆ 发布到云端</button>
    <button class="btn" id="btnMore">⋯</button>
  </div>

  <div class="tabs">
    <button data-tab="words" class="on">📝 单词<span class="n" id="nWords"></span></button>
    <button data-tab="levels">🗂️ 关卡<span class="n" id="nLevels"></span></button>
    <button data-tab="shop">🛒 商品<span class="n" id="nShop"></span></button>
  </div>

  <div id="main"></div>
</div>

<div id="mask"><div id="modal"></div></div>
<div id="prog"><div class="box"><h3 id="progTitle">处理中…</h3><div class="bar"><i id="progBar"></i></div><div class="msg" id="progMsg"></div></div></div>
<div id="toast"></div>

<script>
'use strict';
/* =====================================================================
 *  橙子资产管家（泡泡英语 · 电脑端资产管理器）
 *  纯静态单文件，托管在 GitHub Pages，不含任何数据。
 *
 *  数据流：
 *    本地草稿(localStorage) --发布--> chengzi-assets 仓库文件树
 *    chengzi-assets manifest --拉取--> 本地草稿（图片异步补全为 dataURL）
 *
 *  ⚠️ 三条铁律（与手机端约定，改任何一条都要两端同步改）：
 *    1. 只管「资产字段」：word/img、关卡结构、商品 name/img/price。
 *       学习进度(proficiency等)、score、redeemLog、settings 永不写入资产包。
 *    2. 商品 stock 以手机端为准，本工具不存也不改。
 *    3. 图片压缩参数必须与 app 的 U.compressImage 完全一致，
 *       且「未主动换图就绝不重压」，否则 JPEG 反复有损压缩会毁画质。
 * =================================================================== */

/* ---------- 可按需修改的配置 ---------- */
const GATE_PASS   = 'chengzi2026';                 // 门帘口令（防误入，非安全机制）
const ASSET_REPO  = 'xuange-3721/chengzi-assets';  // 资产数据仓库（只写文件树，禁止建 release！）
const ASSET_BRANCH= 'main';
const ASSET_DIR   = 'assets';                      // 仓库内根目录
const IMG_DIR     = 'assets/images';               // 图片目录（按内容hash命名）
const MAX_IMG     = 200;                           // 与 app 压缩一致：最长边 200px

/* ---------- 门帘 ---------- */
const gate = document.getElementById('gate');
function tryGate(){
  const v = document.getElementById('gateInput').value;
  if(v === GATE_PASS){
    try{ sessionStorage.setItem('cz_gate','1'); }catch(e){}
    gate.style.display='none';
    document.getElementById('app').style.display='block';
    App.boot();
  }else{
    document.getElementById('gateErr').textContent='口令不对';
    document.querySelector('#gate .box').classList.remove('shake');
    void document.querySelector('#gate .box').offsetWidth;
    document.querySelector('#gate .box').classList.add('shake');
  }
}
document.getElementById('gateBtn').addEventListener('click',tryGate);
document.getElementById('gateInput').addEventListener('keydown',e=>{ if(e.key==='Enter') tryGate(); });
try{ if(sessionStorage.getItem('cz_gate')==='1'){ gate.style.display='none';
  document.getElementById('app').style.display='block'; } }catch(e){}

/* ---------- 小工具 ---------- */
const $ = s=>document.querySelector(s);
const esc = s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(m,ms){ const t=$('#toast'); t.textContent=m; t.classList.add('show');
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'), ms||2400); }
function uid(p){ return p+'_'+Date.now()+'_'+Math.floor(Math.random()*1000); }
/* FNV-1a 64位（拼两个32位）—— 图片内容指纹，用于文件命名与增量判断 */
function fnv(str){
  let h1=0x811c9dc5,h2=0x01000193^0x9dc5;
  for(let i=0;i<str.length;i++){
    const c=str.charCodeAt(i);
    h1^=c;      h1=Math.imul(h1,0x01000193)>>>0;
    h2^=(c+i)&0xffff; h2=Math.imul(h2,0x85ebca6b)>>>0;
  }
  return ('0000000'+h1.toString(16)).slice(-8)+('0000000'+h2.toString(16)).slice(-8);
}
function utf8ToB64(s){ return btoa(unescape(encodeURIComponent(s))); }
function b64ToUtf8(s){ return decodeURIComponent(escape(atob(s.replace(/\s/g,'')))); }

/* 图片压缩 —— 与 app U.compressImage 逐字一致（改一处必须同步改另一处） */
function compressImage(file, cb){
  const reader = new FileReader();
  reader.onload = e=>{
    const img = new Image();
    img.onload = ()=>{
      const canvas = document.createElement('canvas');
      let w=img.width, h=img.height;
      if(w>h){ if(w>MAX_IMG){h=h*MAX_IMG/w; w=MAX_IMG;} } else { if(h>MAX_IMG){w=w*MAX_IMG/h; h=MAX_IMG;} }
      canvas.width=w; canvas.height=h;
      const ctx=canvas.getContext('2d');
      ctx.drawImage(img,0,0,w,h);
      let out='image/jpeg';
      try{
        const d=ctx.getImageData(0,0,w,h).data; let hasAlpha=false;
        for(let i=3;i<d.length;i+=4){ if(d[i]<250){ hasAlpha=true; break; } }
        if(hasAlpha) out='image/png';
      }catch(err){ out='image/png'; }
      cb(canvas.toDataURL(out, 0.88));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}
function dataUrlExt(du){ return du.indexOf('data:image/png')===0 ? 'png' : 'jpg'; }

/* 文件名 → 英文单词。与手机端 U.parseWord 逐字一致（改一处必须同步改另一处）：
   拒绝相机/截图自动命名（含3位以上连续数字、img/dsc/photo/screenshot 等前缀） */
function parseWord(fname){
  let base = String(fname||'').replace(/\.[^.]+$/,'').replace(/\(\d+\)/g,' ');
  if(/\d{3,}/.test(base)) return '';
  let segs = (base.match(/[A-Za-z][A-Za-z '’\-]*/g)||[])
    .map(s=>s.trim().replace(/\s+/g,' ').replace(/[\s\-'’]+$/,''))
    .filter(s=>s.length>=2);
  if(!segs.length) return '';
  segs.sort((a,b)=>b.length-a.length);
  let w = segs[0].toLowerCase();
  if(/(^|\s)(img|dsc|dscn|dscf|photo|screenshot|screen|image|pic|untitled|newfile|received|copy|副本)(\s|$)/.test(w)) return '';
  if(/^(wechat|wx|mmexport|signal|telegram|screenshot)/.test(w)) return '';
  return w;
}

/* ---------- 本地草稿 ---------- */
const DRAFT_KEY='chengzi_asset_draft_v1', PAT_KEY='chengzi_asset_pat';
function blankDraft(){
  return { format:'chengzi-assets/1', updatedAt:0, rev:0,
    words:[], levels:[], shop:{items:[]} };
}
const Store = {
  data:null,
  load(){
    try{ const s=localStorage.getItem(DRAFT_KEY); if(s){ this.data=JSON.parse(s); return; } }catch(e){}
    this.data=blankDraft();
  },
  save(){ try{ localStorage.setItem(DRAFT_KEY, JSON.stringify(this.data)); }catch(e){ toast('本地保存失败（可能空间不足）'); } },
  pat(){ try{ return localStorage.getItem(PAT_KEY)||''; }catch(e){ return ''; } },
  setPat(v){ try{ v? localStorage.setItem(PAT_KEY,v) : localStorage.removeItem(PAT_KEY); }catch(e){} }
};

/* ---------- GitHub API ---------- */
const GH = {
  base:'https://api.github.com',
  hdr(extra){ const h={ 'Authorization':'Bearer '+Store.pat(),
    'Accept':'application/vnd.github+json', 'User-Agent':'chengzi-asset-manager' };
    return Object.assign(h, extra||{}); },

  async req(path, opts){
    const r = await fetch(this.base+path, opts);
    if(r.status===401) throw new Error('Token 无效或已过期（401），请到「⋯」里重新设置');
    if(r.status===403) throw new Error('Token 权限不足或触发限流（403）。确认 token 只勾了 chengzi-assets 的 Contents: Read and write');
    if(r.status===404) return null;
    if(!r.ok){
      let d=''; try{ d=(await r.json()).message||''; }catch(e){}
      throw new Error('GitHub API '+r.status+' '+(d||'').slice(0,120));
    }
    return r;
  },
  /* 读文件：返回 {content(原文), sha, size}；不存在返回 null */
  async getFile(path){
    const r = await this.req('/repos/'+ASSET_REPO+'/contents/'+path+'?ref='+ASSET_BRANCH,
      { headers:this.hdr({'Accept':'application/vnd.github.raw'}) });
    if(!r) return null;
    return { content: await r.text(), sha: r.headers.get('x-git-sha')||'' , size:0 };
  },
  /* 读目录：返回 [{name,sha,size,path}]；不存在返回 null */
  async listDir(path){
    const r = await this.req('/repos/'+ASSET_REPO+'/contents/'+path+'?ref='+ASSET_BRANCH+'&_cb='+Date.now(),{headers:this.hdr()});
    if(!r) return null;
    const d = await r.json();
    return Array.isArray(d)? d : null;
  },
  /* 一次列出目录 → {文件名: sha}；目录不存在返回 {}。
     发布前只查这一次，替代逐文件 GET：又快，又避开"刚 PUT 完立刻 GET"的缓存 404 */
  async getDirShaMap(path){
    const files = await this.listDir(path);
    const map={};
    (files||[]).forEach(f=>{ if(f.type==='file') map[f.name]=f.sha; });
    return map;
  },
  /* 写文件（文本）。knownSha 可省一次 GET；若 GitHub 报 422「缺 sha」说明它那边文件已存在
     而我们的查询撞上了缓存 404 —— 自动重取 sha 重试一次（自愈兜底）。 */
  async putText(path, text, message, knownSha){
    const body = { message, content: utf8ToB64(text), branch: ASSET_BRANCH };
    if(knownSha) body.sha = knownSha;
    try{
      const r = await this.req('/repos/'+ASSET_REPO+'/contents/'+path,
        { method:'PUT', headers:this.hdr({'Content-Type':'application/json'}), body: JSON.stringify(body) });
      if(!r) throw new Error('写入失败：'+path);
      return (await r.json()).content;
    }catch(e){
      if(String((e&&e.message)||'').indexOf('422')<0) throw e;
      const sha = await this.getFileSha(path);
      if(!sha) throw e;
      body.sha = sha;
      const r = await this.req('/repos/'+ASSET_REPO+'/contents/'+path,
        { method:'PUT', headers:this.hdr({'Content-Type':'application/json'}), body: JSON.stringify(body) });
      if(!r) throw new Error('写入失败（重试后）：'+path);
      return (await r.json()).content;
    }
  },
  /* 写二进制（base64，dataURL 去前缀后的部分），重试逻辑同上 */
  async putB64(path, b64, message, knownSha){
    const body = { message, content: b64, branch: ASSET_BRANCH };
    if(knownSha) body.sha = knownSha;
    try{
      const r = await this.req('/repos/'+ASSET_REPO+'/contents/'+path,
        { method:'PUT', headers:this.hdr({'Content-Type':'application/json'}), body: JSON.stringify(body) });
      if(!r) throw new Error('写入失败：'+path);
    }catch(e){
      if(String((e&&e.message)||'').indexOf('422')<0) throw e;
      const sha = await this.getFileSha(path);
      if(!sha) throw e;
      body.sha = sha;
      const r = await this.req('/repos/'+ASSET_REPO+'/contents/'+path,
        { method:'PUT', headers:this.hdr({'Content-Type':'application/json'}), body: JSON.stringify(body) });
      if(!r) throw new Error('写入失败（重试后）：'+path);
    }
  },
  /* 读单个文件的 sha。加时间戳破缓存 —— GitHub 对 contents GET 有边缘缓存，
     刚 PUT 的文件立刻查可能返回 404 → 被误判成"新文件"而不带 sha → 422 的根因 */
  async getFileSha(path){
    const r = await this.req('/repos/'+ASSET_REPO+'/contents/'+path+'?ref='+ASSET_BRANCH+'&_cb='+Date.now(),{headers:this.hdr()});
    if(!r) return null;
    return (await r.json()).sha;
  },
  async deleteFile(path, sha, message){
    const r = await this.req('/repos/'+ASSET_REPO+'/contents/'+path,
      { method:'DELETE', headers:this.hdr({'Content-Type':'application/json'}),
        body: JSON.stringify({ message, sha, branch: ASSET_BRANCH }) });
    if(!r) throw new Error('删除失败：'+path);
  },
  async testRepo(){
    const r = await this.req('/repos/'+ASSET_REPO,{headers:this.hdr()});
    if(!r) throw new Error('看不到仓库 '+ASSET_REPO+'（404）。检查仓库名，或 token 没授权这个仓库');
    return await r.json();
  },
  /* 图片的 raw 下载地址（带 token 走 api 域名，可达性已验证） */
  rawUrl(path){ return this.base+'/repos/'+ASSET_REPO+'/contents/'+path+'?ref='+ASSET_BRANCH; },
  async downloadImage(path){
    const r = await this.req('/repos/'+ASSET_REPO+'/contents/'+path+'?ref='+ASSET_BRANCH,
      { headers:this.hdr({'Accept':'application/vnd.github.raw'}) });
    if(!r) return null;
    const blob = await r.blob();
    return await new Promise(res=>{
      const fr=new FileReader(); fr.onload=()=>res(fr.result); fr.onerror=()=>res(null); fr.readAsDataURL(blob);
    });
  }
};

/* ---------- 渲染 img 的统一入口：dataURL / emoji / 云端路径 三态 ---------- */
function imgHtml(v, cls){
  if(!v) return '<span>❓</span>';
  if(String(v).indexOf('data:')===0) return '<img src="'+v+'">';
  if(String(v).indexOf('images/')===0){
    const u = GH.rawUrl(ASSET_DIR+'/'+v.replace(/^images\//,''));
    return '<img src="'+esc(u)+'" onerror="this.parentNode.textContent=\'🖼️\'">';
  }
  return esc(v); // emoji
}

const Words = {
  edit(id){
    const w = id? Store.data.words.find(x=>x.id===id) : null;

      const img = pendingImg || (w? w.img : '');

  del(id){

    if(used.length) msg+='\n\n它还在关卡里：'+used.join('、')+'（会一并移出）';
    if(!confirm(msg)) return;
    Store.data.words = Store.data.words.filter(x=>x.id!==id);

  },

  /* ---------- 批量导入：文件选择器支持框选 / Ctrl+多选，文件名自动推导单词 ---------- */
  bulk(){
    const inp=document.createElement('input');
    inp.type='file'; inp.accept='image/*'; inp.multiple=true;
    inp.addEventListener('change',()=> this.bulkHandle(inp.files));
    inp.click();
  },
  async bulkHandle(files){
    if(App.busy) return;
    const list=Array.from(files||[]).filter(f=>!f.type || /^image\//.test(f.type));
    if(!list.length){ toast('没有可导入的图片'); return; }
    App.busy=true;
    $('#progTitle').textContent='批量读取图片'; $('#prog').classList.add('show'); Publish.prog(0,'0 / '+list.length);
    const items=[];
    for(let i=0;i<list.length;i++){
      const f=list[i];
      const img = await new Promise(res=>{ try{ compressImage(f,res); }catch(e){ res(''); } });
      items.push({ name:f.name, word:parseWord(f.name), img:img, keep:true, action:'keep', dups:[] });
      Publish.prog((i+1)/list.length,(i+1)+' / '+list.length);
    }
    $('#prog').classList.remove('show');
    App.busy=false;
    this.bulkRefreshDups(items);
    this.bulkPanel(items);
  },
  bulkRefreshDups(items){
    items.forEach(it=>{
      it.dups = it.word ? Store.data.words.filter(x=>x.word===it.word) : [];
      if(!it.dups.length) it.action='keep';
    });
  },
  bulkPanel(items){
    $('#modal').classList.add('wide');
    const rows = items.map((it,i)=>{
      const tag = !it.word ? '<span class="bi-tag err">需填单词</span>'
        : (it.dups.length ? '<span class="bi-tag">同名×'+it.dups.length+'</span>' : '');
      let row = '<div class="bi-row'+(it.dups.length?' dup':'')+'">'
        +'<input type="checkbox" data-keep="'+i+'"'+(it.keep?' checked':'')+'>'
        +'<div class="bi-thumb">'+(it.img?'<img src="'+it.img+'">':'❓')+'</div>'
        +'<input class="bi-word" type="text" data-word="'+i+'" value="'+esc(it.word)+'" placeholder="英文单词">'
        + tag + '</div>';
      // 重名对比：列出已有图 + 本次新图，三选一策略（与手机端批量导入一致）
      if(it.keep && it.dups.length){
        const olds = it.dups.map(w=>'<div class="bi-side"><div class="bi-thumb">'+imgHtml(w.img)+'</div><span>已有</span></div>').join('');
        const note = it.dups.length>1 ? '<span class="bi-note">替换第1个</span>' : '';
        const acts = [['keep','都保留'],['replace','替换旧图'],['skip','不导入这张']]
          .map(a=>'<button class="bi-act'+(it.action===a[0]?' on':'')+'" data-act="'+a[0]+'" data-i="'+i+'">'+a[1]+'</button>').join('');
        row += '<div class="bi-cmp">'+olds
          +'<div class="bi-side"><div class="bi-thumb">'+imgHtml(it.img)+'</div><span>本次</span></div>'
          +'<div class="bi-acts">'+note+acts+'</div></div>';
      }
      return row;
    }).join('');
    const lvOpts = '<option value="">仅加入单词库（不挂关卡）</option>'
      + Store.data.levels.map(l=>'<option value="'+esc(l.id)+'">'+esc(l.name)+'（'+(l.wordIds||[]).length+' 词）</option>').join('')
      + '<option value="__new">＋ 新建关卡…</option>';
    const nOk = items.filter(it=>it.keep && it.word).length;
    Modal.open(`
      <h3>📦 批量导入 <span style="font-size:.78rem;color:var(--c-muted)">共 ${items.length} 张 · 单词自动取自文件名，可逐条修改</span></h3>
      <div class="bi-list">${rows||'<div class="empty">（空）</div>'}</div>
      <div class="frow" style="margin-top:12px"><label>导入到</label>
        <select id="biLevel" style="width:100%;padding:10px 12px;border:2px solid #E3ECF5;border-radius:11px;outline:none;background:#fff">${lvOpts}</select></div>
      <div id="biNewLv" style="display:none">
        <div class="frow"><label>新关卡名称</label><input type="text" id="biLvName" placeholder="动物篇"></div>
        <div class="frow"><label>关卡图标（emoji）</label><input type="text" id="biLvIcon" placeholder="🐶" maxlength="8"></div>
      </div>
      <div class="brow"><button class="btn" id="biCancel" style="flex:1">取消</button>
        <button class="btn btn-primary" id="biOk" style="flex:2">确认导入 ${nOk} 个</button></div>
      <div class="hint" style="margin-top:8px">相机/截图自动命名的图片（IMG_1234 等）无法推导单词，需手动填写。</div>`);
    const self=this;
    $('#modal').querySelectorAll('[data-keep]').forEach(cb=>cb.addEventListener('change',e=>{
      items[+e.target.dataset.keep].keep=e.target.checked; self.bulkPanel(items);
    }));
    $('#modal').querySelectorAll('[data-word]').forEach(inp=>{
      inp.addEventListener('input',e=>{ items[+e.target.dataset.word].word=e.target.value.trim().toLowerCase(); });
      inp.addEventListener('change',()=>{ self.bulkRefreshDups(items); self.bulkPanel(items); });
    });
    $('#modal').querySelectorAll('[data-act]').forEach(btn=>btn.addEventListener('click',e=>{
      items[+e.currentTarget.dataset.i].action=e.currentTarget.dataset.act; self.bulkPanel(items);
    }));
    $('#biLevel').addEventListener('change',e=>{
      $('#biNewLv').style.display = e.target.value==='__new' ? 'block' : 'none';
    });
    $('#biCancel').addEventListener('click',Modal.close);
    $('#biOk').addEventListener('click',()=> this.bulkApply(items));
  },
  bulkApply(items){
    const d=Store.data;
    // 校验：勾选的行必须有单词，且本次批量内部不重复
    const seen={};
    for(const it of items){
      if(!it.keep) continue;
      if(!it.word){ toast('有未填单词的行 —— 取消勾选或填好再导入'); return; }
      const k=it.word.toLowerCase();
      if(seen[k]){ toast('本次批量里单词重复：'+it.word); return; }
      seen[k]=1;
    }
    // 关卡去向
    let lv=null;
    const lvSel=$('#biLevel').value;
    if(lvSel==='__new'){
      const n=$('#biLvName').value.trim();
      if(!n){ toast('请填写新关卡名称'); return; }
      lv={ id:uid('l'), name:n, icon:($('#biLvIcon').value.trim()||'📦'), wordIds:[], order:d.levels.length };
      d.levels.push(lv);
    }else if(lvSel){ lv=d.levels.find(x=>x.id===lvSel) || null; }
    // 逐条应用（与手机端一致：替换第 1 个同名）
    let nAdd=0,nRep=0,nKeep=0;
    const touched=[];
    items.forEach(it=>{
      if(!it.keep || !it.word) return;
      const cur = it.dups.length? it.dups[0] : null;
      if(cur && it.action==='skip') return;
      if(cur && it.action==='replace'){ cur.img=it.img; nRep++; touched.push(cur.id); }
      else { const w={ id:uid('w'), word:it.word, img:it.img }; d.words.push(w); nAdd++; if(cur) nKeep++; touched.push(w.id); }
    });
    if(lv && touched.length) touched.forEach(id=>{ if(!lv.wordIds.includes(id)) lv.wordIds.push(id); });
    Store.save(); App.refreshBadges(); App.render(); Modal.close();
    toast('✅ 已导入：新增 '+nAdd+' · 替换图 '+nRep+(nKeep?(' · 同名并存 '+nKeep):'')+(lv?(' · 已挂到「'+lv.name+'」'):''));
  }
};

/* =====================================================================
 *  发布到云端
 * =================================================================== */
const Publish = {
  prog(p,m){ $('#progBar').style.width=Math.round(p*100)+'%'; if(m) $('#progMsg').textContent=m; },

  async run(){
    if(App.busy) return;
    if(!Store.pat()){ toast('先到「⋯」里设置 Token'); More.open(); return; }
    const d=Store.data;
    if(!d.words.length && !d.levels.length && !d.shop.items.length){
      if(!confirm('当前草稿是空的。确认要把空资产发布到云端吗？（会清空云端）')) return;
    }
    // 校验
    const seen={};
    for(const w of d.words){
      if(!w.word){ alert('有单词名为空，请先修好'); return; }
      const k=w.word.toLowerCase();
      if(seen[k]){ alert('单词重复：'+w.word+'（'+seen[k]+' 与 '+w.id+'）\n请先改成不同的单词'); return; }
      seen[k]=w.id;
    }
    for(const it of d.shop.items){ if(!it.name || !(it.price>0)){ alert('商品「'+(it.name||'(未命名)')+'」名称或价格不合法'); return; } }

    App.busy=true;
    $('#progTitle').textContent='发布到云端'; $('#prog').classList.add('show'); this.prog(0,'准备…');
    const log=[];
    try{
      // 1. 收集需要上传的图片：单词/商品的 img、关卡的 icon，是 dataURL 的才需要传；
      //    已是云端路径的说明上次已传过（这就是"增量"），记一条日志让用户看得见
      const jobs=[];
      d.words.forEach(w=>{
        if((w.img||'').startsWith('data:')) jobs.push({ref:w, field:'img'});
        else if((w.img||'').startsWith('images/')) log.push('未变 '+w.word+'（云端已有）');
      });
      d.shop.items.forEach(it=>{
        if((it.img||'').startsWith('data:')) jobs.push({ref:it, field:'img'});
        else if((it.img||'').startsWith('images/')) log.push('未变 '+it.name+'（云端已有）');
      });
      d.levels.forEach(lv=>{
        if((lv.icon||'').startsWith('data:')) jobs.push({ref:lv, field:'icon'});
        else if((lv.icon||'').startsWith('images/')) log.push('未变 图标·'+lv.name+'（云端已有）');
      });
      const total=jobs.length+1;
      // 2. 一次性列出云端图片目录的 sha 映射（替代逐文件 GET：更快，也避开缓存 404）
      this.prog(0,'读取云端图片索引…');
      const shas = await GH.getDirShaMap(IMG_DIR);   // {文件名: sha}
      // 3. 逐张上传。⚠️ 全部成功后才把草稿引用换成云端路径 —— 中途失败不污染草稿，重试永远安全
      const done=[];
      for(let i=0;i<jobs.length;i++){
        const j=jobs[i];
        const du=j.ref[j.field];
        const h=fnv(du);
        const name=j.ref.id+'.'+h+'.'+dataUrlExt(du);
        this.prog(i/total,'上传图片 '+(i+1)+'/'+jobs.length+' …');
        if(shas[name]){
          log.push('跳过（内容未变）'+name);
        }else{
          await GH.putB64(IMG_DIR+'/'+name, du.split(',')[1], '图片 '+name, shas[name]||null);
          shas[name]=shas[name]||'1';   // 内存登记，同批重复引用不再查
          log.push('上传图片 '+name);
        }
        done.push({ref:j.ref, field:j.field, rel:'images/'+name});
      }
      done.forEach(x=>{ x.ref[x.field]=x.rel; });
      Store.save();
      // 4. 写 manifest
      this.prog(jobs.length/total,'写入 manifest.json …');
      const manifest={
        format:'chengzi-assets/1',
        updatedAt:Date.now(),
        rev:(d.rev||0)+1,
        counts:{ words:d.words.length, levels:d.levels.length, shop:d.shop.items.length },
        words: d.words.map(w=>({ id:w.id, word:w.word, img:w.img })),
        levels: d.levels.slice().sort((a,b)=>(a.order||0)-(b.order||0)).map((lv,i)=>({ id:lv.id, name:lv.name, icon:lv.icon||'📦', wordIds:lv.wordIds||[], order:i })),
        shop: { items: d.shop.items.map(it=>({ id:it.id, name:it.name, img:it.img, price:it.price })) }
      };
      const manShas = await GH.getDirShaMap(ASSET_DIR);
      await GH.putText(ASSET_DIR+'/manifest.json', JSON.stringify(manifest,null,1),
        '资产 v'+manifest.rev+'（单词'+manifest.counts.words+'/关卡'+manifest.counts.levels+'/商品'+manifest.counts.shop+'）',
        manShas['manifest.json']||null);
      Store.data.updatedAt=manifest.updatedAt; Store.data.rev=manifest.rev; Store.save();
      this.prog(1,'完成');
      log.unshift('✅ 已发布 rev '+manifest.rev+'（单词'+manifest.counts.words+'/关卡'+manifest.counts.levels+'/商品'+manifest.counts.shop+'）');
      $('#progMsg').innerHTML='';
      $('#progMsg').insertAdjacentHTML('beforeend','<div class="log">'+esc(log.join('\n'))+'</div>');
      toast('✅ 已发布到云端，手机端可同步');
      setTimeout(()=>{ $('#prog').classList.remove('show'); }, 1600);
    }catch(e){
      $('#prog').classList.remove('show');
      alert('发布失败：\n'+(e.message||e));
    }finally{
      App.busy=false;
    }
  }
};

/* =====================================================================
 *  从云端拉取
 * =================================================================== */
const Pull = {
  prog(p,m){ $('#progBar').style.width=Math.round(p*100)+'%'; if(m) $('#progMsg').textContent=m; },
  async run(){
    if(App.busy) return;
    if(!Store.pat()){ toast('先到「⋯」里设置 Token'); More.open(); return; }
    App.busy=true;
    $('#progTitle').textContent='从云端拉取'; $('#prog').classList.add('show'); this.prog(0.05,'读取 manifest …');
    try{
      const f = await GH.getFile(ASSET_DIR+'/manifest.json');
      if(!f){ $('#prog').classList.remove('show'); App.busy=false;
        if(confirm('云端还没有 manifest（第一次用）。\n要跳过拉取、直接开始新建吗？')) return;
        return; }
      const man = JSON.parse(f.content);
      const local = Store.data;
      const localRev = local.rev||0;
      // 覆盖确认
      if(local.words.length || local.levels.length || local.shop.items.length){
        const newer = (man.updatedAt||0) >= (local.updatedAt||0);
        const msg='云端 rev '+man.rev+'（'+new Date(man.updatedAt).toLocaleString()+'）\n'
          +'本地 rev '+localRev+'（'+(local.updatedAt? new Date(local.updatedAt).toLocaleString():'尚无')+'）\n\n'
          +'单词 '+man.counts.words+' / 关卡 '+man.counts.levels+' / 商品 '+man.counts.shop+'\n\n'
          +(newer?'⚠️ 会覆盖当前本地草稿（建议先在「⋯」里导出备份）':'⚠️ 注意：本地看起来比云端新，确定还要拉取覆盖吗？');
        if(!confirm(msg+'\n\n继续？')){ $('#prog').classList.remove('show'); App.busy=false; return; }
      }
      // 写入草稿：img 可能是云端路径（异步补全）或 emoji
      Store.data = {
        format:man.format||'chengzi-assets/1', updatedAt:man.updatedAt||0, rev:man.rev||0,
        words:(man.words||[]).map(w=>({id:w.id, word:w.word, img:w.img||''})),
        levels:(man.levels||[]).map(lv=>({id:lv.id, name:lv.name, icon:lv.icon||'📦', wordIds:lv.wordIds||[], order:lv.order||0})),
        shop:{ items:(man.shop&&man.shop.items||[]).map(it=>({id:it.id, name:it.name, img:it.img||'', price:it.price})) }
      };
      Store.save(); App.refreshBadges(); App.render();
      // 异步把云端路径图片补全为 dataURL（这样导出/离线可用）
      const need = [];
      Store.data.words.forEach(w=>{ if((w.img||'').startsWith('images/')) need.push(w); });
      Store.data.shop.items.forEach(it=>{ if((it.img||'').startsWith('images/')) need.push(it); });
      if(need.length){
        $('#progMsg').textContent='下载图片 0/'+need.length+' …';
        let ok=0;
        for(let i=0;i<need.length;i++){
          const rel=need[i].img;                       // images/xxx.jpg
          const full=ASSET_DIR+'/'+rel.replace(/^images\//,'images/');
          try{ const du=await GH.downloadImage(full); if(du){ need[i].img=du; ok++; } }catch(e){}
          this.prog(0.2+0.8*(i+1)/need.length,'下载图片 '+(i+1)+'/'+need.length);
        }
        Store.save();
        toast('✅ 已拉取（图片 '+ok+'/'+need.length+' 张已缓存）');
      }else{
        toast('✅ 已拉取 rev '+Store.data.rev);
      }
      this.prog(1,'完成');
      setTimeout(()=>{ $('#prog').classList.remove('show'); }, 900);
    }catch(e){
      $('#prog').classList.remove('show'); alert('拉取失败：\n'+(e.message||e));
    }finally{ App.busy=false; }
  }
};

    $('#mClose').addEventListener('click',Modal.close);
  },

  /* 导出：把云端路径的图先下载回 dataURL，产出与手机端互通的资产包 */
  async exportPkg(){
    const d=JSON.parse(JSON.stringify(Store.data));
    const need=[];
    d.words.forEach(w=>{ if((w.img||'').startsWith('images/')) need.push(w); });
    d.shop.items.forEach(it=>{ if((it.img||'').startsWith('images/')) need.push(it); });
    if(!Store.pat()){ toast('导出需要 Token 来下载云端图片'); return; }
    if(need.length){ $('#progTitle').textContent='导出资产包'; $('#prog').classList.add('show'); Pull.prog(0,'下载云端图片…'); }
    try{
      for(let i=0;i<need.length;i++){
        try{ const du=await GH.downloadImage(ASSET_DIR+'/'+need[i].img); if(du) need[i].img=du; }catch(e){}
        Pull.prog((i+1)/need.length,'下载 '+(i+1)+'/'+need.length);
      }
      const pkg={ format:'chengzi-assets/1', exportedAt:Date.now(),
        words:d.words.map(w=>({id:w.id,word:w.word,img:w.img})),
        levels:d.levels.map(lv=>({id:lv.id,name:lv.name,icon:lv.icon,wordIds:lv.wordIds,order:lv.order})),
        shop:{ items:d.shop.items.map(it=>({id:it.id,name:it.name,img:it.img,price:it.price})) } };
      const blob=new Blob([JSON.stringify(pkg)],{type:'application/json'});
      const a=document.createElement('a');
      a.href=URL.createObjectURL(blob);
      a.download='chengzi-assets-'+new Date().toISOString().slice(0,10)+'.json';
      a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),3000);
      toast('✅ 已导出');
    }catch(e){ alert('导出失败：'+(e.message||e)); }
    finally{ $('#prog').classList.remove('show'); }
  },

  /* 导入手机端资产包（或本工具导出的包） */
  importPkg(file){
    const fr=new FileReader();
    fr.onload=()=>{
      let pkg; try{ pkg=JSON.parse(fr.result); }catch(e){ alert('文件不是合法 JSON'); return; }
      if(!pkg || !Array.isArray(pkg.words)){ alert('格式不对：缺 words 数组'); return; }
      // diff（按 id 优先，其次按 word 文本）
      const d=Store.data;
      const byId={}, byWord={};
      d.words.forEach(w=>{ byId[w.id]=w; byWord[w.word.toLowerCase()]=w; });
      const rows=[];
      (pkg.words||[]).forEach(nw=>{
        const cur = byId[nw.id] || byWord[(nw.word||'').toLowerCase()];
        rows.push({ kind:'word', cur, nw,
          st: !cur?'add': ((cur.img!==nw.img)?'upd':'same') });
      });
      d.words.forEach(w=>{ if(!(pkg.words||[]).some(nw=>nw.id===w.id) && !rows.some(r=>r.cur===w)) rows.push({kind:'word',cur:w,st:'local'}); });
      (pkg.shop&&pkg.shop.items||[]).forEach(ns=>{
        const cur = d.shop.items.find(x=>x.id===ns.id) || d.shop.items.find(x=>x.name===ns.name);
        rows.push({ kind:'shop', cur, nw:ns, st: !cur?'add':((cur.img!==ns.img||cur.price!==ns.price)?'upd':'same') });
      });
      const nAdd=rows.filter(r=>r.st==='add').length,
            nUpd=rows.filter(r=>r.st==='upd').length,
            nSame=rows.filter(r=>r.st==='same').length,
            nLoc=rows.filter(r=>r.st==='local').length;
      const tag=s=>({add:'<span class="tag add">新增</span>',upd:'<span class="tag upd">更新</span>',
        same:'<span class="tag same">未变</span>',local:'<span class="tag same">仅本地</span>'}[s]);
      const name=r=> r.kind==='word'? (r.nw? r.nw.word : (r.cur&&r.cur.word)) : (r.nw? r.nw.name : (r.cur&&r.cur.name));
      Modal.open(`
        <h3>导入资产包</h3>
        <div class="frow">
          <div class="hint" style="margin-bottom:10px">
            新增 <b>${nAdd}</b> · 更新 <b>${nUpd}</b> · 未变 ${nSame} · 仅本地保留 ${nLoc}<br>
            🔒 学习进度 / 积分 / 兑换记录 / 库存 <b>一律不会被改动</b>；「仅本地」的条目不会被删除。
          </div>
          <div class="diff-list">${rows.map(r=>'<div class="di">'+tag(r.st)+'<span>'+esc(name(r)||'?')+'</span>'
            +'<span style="color:#999;font-size:.75rem;margin-left:auto">'+esc(r.kind==='word'?'单词':'商品')+'</span></div>').join('')}</div>
        </div>
        <div class="brow"><button class="btn" id="iCancel">取消</button>
          <button class="btn btn-primary" id="iGo">确认导入 ${nAdd+nUpd} 项变更</button></div>`);
      $('#iCancel').addEventListener('click',Modal.close);
      $('#iGo').addEventListener('click',()=>{
        rows.forEach(r=>{
          if(r.st==='add'){
            if(r.kind==='word') d.words.push({id:r.nw.id||uid('w'), word:r.nw.word, img:r.nw.img||''});
            else d.shop.items.push({id:r.nw.id||uid('s'), name:r.nw.name, img:r.nw.img||'', price:r.nw.price||1});
          }else if(r.st==='upd'){
            if(r.kind==='word'){ r.cur.word=r.nw.word; r.cur.img=r.nw.img; }
            else { r.cur.name=r.nw.name; r.cur.img=r.nw.img; r.cur.price=r.nw.price; }
          }
        });
        if(pkg.levels && confirm('资产包里还带了关卡结构（'+pkg.levels.length+' 个）。\n替换本地的关卡列表吗？（取消 = 保留本地关卡）')){
          d.levels = pkg.levels.map((lv,i)=>({id:lv.id||uid('l'), name:lv.name, icon:lv.icon||'📦', wordIds:lv.wordIds||[], order:lv.order!=null?lv.order:i}));
        }
        Store.save(); App.refreshBadges(); App.render(); Modal.close();
        toast('✅ 已导入到本地草稿（要生效请「发布到云端」）');
      });
    };
    fr.readAsText(file);
  },

  /* 清理未被 manifest 引用的云端图片 */
  async cleanup(){
    if(!Store.pat()){ toast('先设置 Token'); return; }
    if(!confirm('扫描云端图片目录，列出没有被 manifest 引用的文件。\n继续？')) return;
    $('#progTitle').textContent='清理云端图片'; $('#prog').classList.add('show'); Pull.prog(0.2,'列出云端文件…');
    try{
      const files = await GH.listDir(IMG_DIR);
      const man = await GH.getFile(ASSET_DIR+'/manifest.json');
      if(!files || !files.length){ $('#prog').classList.remove('show'); toast('云端没有图片目录'); return; }
      const used=new Set();
      if(man){
        const m=JSON.parse(man.content);
        (m.words||[]).forEach(w=>{ if((w.img||'').startsWith('images/')) used.add(w.img.split('/').pop()); });
        ((m.shop&&m.shop.items)||[]).forEach(it=>{ if((it.img||'').startsWith('images/')) used.add(it.img.split('/').pop()); });
        (m.levels||[]).forEach(lv=>{ if((lv.icon||'').startsWith('images/')) used.add(lv.icon.split('/').pop()); });
      }
      const junk = files.filter(f=>f.type==='file' && !used.has(f.name));
      $('#prog').classList.remove('show');
      if(!junk.length){ toast('✅ 没有可清理的图片，云端很干净'); return; }
      if(!confirm('发现 '+junk.length+' 张未被引用的图片：\n\n'+junk.slice(0,20).map(f=>f.name).join('\n')+(junk.length>20?'\n… 等':'')+'\n\n删除它们？（不可恢复）')) return;
      $('#prog').classList.add('show'); Pull.prog(0,'删除中…');
      for(let i=0;i<junk.length;i++){
        await GH.deleteFile(IMG_DIR+'/'+junk[i].name, junk[i].sha, '清理未引用图片 '+junk[i].name);
        Pull.prog((i+1)/junk.length,'删除 '+(i+1)+'/'+junk.length);
      }
      toast('✅ 已清理 '+junk.length+' 张');
    }catch(e){ $('#prog').classList.remove('show'); alert('清理失败：'+(e.message||e)); }
    finally{ $('#prog').classList.remove('show'); }
  }
};

/* ---------- 启动 ---------- */
if(sessionStorage.getItem('cz_gate')==='1') App.boot();
</script>
